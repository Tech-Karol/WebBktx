<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="WebBktx — Nintendo Game Boy emulator działający w przeglądarce."
    >

    <meta
        name="application-name"
        content="WebBktx Game Boy"
    >

    <title>WebBktx — Game Boy</title>

    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;

            font-family:
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background:
                #101114;

            color:
                #e7e7e7;
        }


        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;

            padding: 32px 16px;
        }


        /* =====================================================
           APP
           ===================================================== */

        .app {
            width: 100%;
            max-width: 1100px;
        }


        /* =====================================================
           HEADER
           ===================================================== */

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;

            margin-bottom: 24px;

            padding: 18px 22px;

            border: 1px solid #292c32;

            border-radius: 14px;

            background:
                #17191d;

            box-shadow:
                0 12px 35px rgba(0, 0, 0, .25);
        }


        .brand {
            display: flex;
            align-items: center;

            gap: 12px;
        }


        .brand-icon {
            width: 44px;
            height: 44px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 10px;

            background:
                #24272d;

            font-size: 23px;
        }


        .brand-text h1 {
            margin: 0;

            font-size: 21px;
            font-weight: 700;
        }


        .brand-text span {
            display: block;

            margin-top: 3px;

            color:
                #8e949d;

            font-size: 13px;
        }


        .status {
            display: flex;
            align-items: center;

            gap: 8px;

            padding: 8px 12px;

            border-radius: 999px;

            background:
                #22252a;

            color:
                #aeb4bd;

            font-size: 13px;
        }


        .status-dot {
            width: 8px;
            height: 8px;

            border-radius: 50%;

            background:
                #777;
        }


        .status.running .status-dot {
            background:
                #72c48c;
        }


        .status.running {
            color:
                #bce9c9;
        }


        /* =====================================================
           LAYOUT
           ===================================================== */

        .layout {
            display: grid;

            grid-template-columns:
                minmax(0, 1fr)
                310px;

            gap: 20px;
        }


        /* =====================================================
           PANELS
           ===================================================== */

        .panel {
            border: 1px solid #292c32;

            border-radius: 14px;

            background:
                #17191d;

            box-shadow:
                0 12px 35px rgba(0, 0, 0, .20);
        }


        /* =====================================================
           SCREEN PANEL
           ===================================================== */

        .screen-panel {
            padding: 20px;
        }


        .screen-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            margin-bottom: 14px;
        }


        .screen-header h2 {
            margin: 0;

            font-size: 15px;
            font-weight: 600;
        }


        .resolution {
            color:
                #777d86;

            font-size: 12px;
        }


        .screen-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;

            width: 100%;

            padding: 26px;

            min-height: 520px;

            border-radius: 12px;

            background:
                #0b0c0e;

            border: 1px solid #24272c;
        }


        canvas {
            display: block;

            width: min(
                100%,
                640px
            );

            height: auto;

            aspect-ratio:
                160 / 144;

            image-rendering:
                pixelated;

            image-rendering:
                crisp-edges;

            background:
                #000;

            border:
                10px solid #22252a;

            border-radius:
                4px;

            box-shadow:
                0 0 0 1px #343840,
                0 20px 50px rgba(0, 0, 0, .5);
        }


        /* =====================================================
           CONTROLS
           ===================================================== */

        .controls {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 9px;

            margin-top: 16px;
        }


        button {
            border: 1px solid #30343a;

            border-radius: 9px;

            padding: 11px 12px;

            background:
                #22252a;

            color:
                #e5e7ea;

            font: inherit;

            font-size: 13px;

            cursor: pointer;

            transition:
                background .15s ease,
                border-color .15s ease,
                transform .1s ease;
        }


        button:hover {
            background:
                #2a2e34;

            border-color:
                #3a3f47;
        }


        button:active {
            transform:
                translateY(1px);
        }


        button.primary {
            background:
                #d9d9d9;

            color:
                #111;

            border-color:
                #d9d9d9;
        }


        button.primary:hover {
            background:
                #ffffff;
        }


        button.danger {
            color:
                #e4a2a2;
        }


        /* =====================================================
           SIDE
           ===================================================== */

        .side {
            display: flex;

            flex-direction: column;

            gap: 16px;
        }


        .side-panel {
            padding: 18px;
        }


        .side-panel h3 {
            margin: 0 0 14px;

            font-size: 14px;
        }


        /* =====================================================
           FILE INPUT
           ===================================================== */

        .file-area {
            display: flex;

            flex-direction: column;

            gap: 10px;
        }


        .file-label {
            display: flex;

            align-items: center;
            justify-content: center;

            min-height: 80px;

            padding: 16px;

            border:
                1px dashed #3a3e45;

            border-radius: 10px;

            background:
                #1d2024;

            color:
                #aeb4bd;

            text-align: center;

            font-size: 13px;

            cursor: pointer;
        }


        .file-label:hover {
            border-color:
                #575d67;

            background:
                #22252a;
        }


        #romInput {
            display: none;
        }


        .file-name {
            min-height: 18px;

            color:
                #777e88;

            font-size: 12px;

            overflow:
                hidden;

            text-overflow:
                ellipsis;

            white-space:
                nowrap;
        }


        /* =====================================================
           INFO
           ===================================================== */

        .info {
            display: flex;

            flex-direction: column;

            gap: 9px;
        }


        .info-row {
            display: flex;

            justify-content: space-between;

            gap: 15px;

            padding-bottom: 9px;

            border-bottom:
                1px solid #25282d;
        }


        .info-row:last-child {
            border-bottom:
                0;

            padding-bottom:
                0;
        }


        .info-label {
            color:
                #7f858e;

            font-size: 12px;
        }


        .info-value {
            color:
                #d7d9dc;

            font-size: 12px;

            text-align: right;

            overflow:
                hidden;

            text-overflow:
                ellipsis;
        }


        /* =====================================================
           STATUS LOG
           ===================================================== */

        .log {
            height: 110px;

            padding: 10px;

            overflow-y: auto;

            border-radius: 8px;

            background:
                #0d0f11;

            border:
                1px solid #25282d;

            font-family:
                monospace;

            font-size: 11px;

            color:
                #8e959e;
        }


        .log-line {
            margin-bottom: 5px;
        }


        /* =====================================================
           FOOTER
           ===================================================== */

        footer {
            margin-top: 20px;

            text-align: center;

            color:
                #60666f;

            font-size: 11px;
        }


        /* =====================================================
           RESPONSIVE
           ===================================================== */

        @media (
            max-width: 850px
        ) {

            .layout {
                grid-template-columns:
                    1fr;
            }


            .screen-wrapper {
                min-height:
                    auto;

                padding:
                    14px;
            }


            .side {
                display: grid;

                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }

        }


        @media (
            max-width: 560px
        ) {

            body {
                padding:
                    14px 10px;
            }


            header {
                align-items:
                    flex-start;

                flex-direction:
                    column;
            }


            .status {
                width:
                    100%;

                justify-content:
                    center;
            }


            .side {
                display:
                    flex;
            }


            .controls {
                grid-template-columns:
                    repeat(2, 1fr);
            }


            .screen-panel {
                padding:
                    12px;
            }


            .screen-wrapper {
                padding:
                    8px;
            }


            canvas {
                border-width:
                    5px;
            }

        }

    </style>
</head>


<body>

<div class="app">

    <!-- =====================================================
         HEADER
         ====================================================== -->

    <header>

        <div class="brand">

            <div class="brand-icon">
                🎮
            </div>

            <div class="brand-text">

                <h1>
                    WebBktx
                </h1>

                <span>
                    Nintendo Game Boy Emulator
                </span>

            </div>

        </div>


        <div
            id="status"
            class="status"
        >

            <span
                id="statusDot"
                class="status-dot"
            ></span>

            <span id="statusText">
                Gotowy
            </span>

        </div>

    </header>


    <!-- =====================================================
         MAIN
         ====================================================== -->

    <main class="layout">


        <!-- =================================================
             SCREEN
             ================================================== -->

        <section class="panel screen-panel">

            <div class="screen-header">

                <h2>
                    Ekran Game Boy
                </h2>

                <span class="resolution">
                    160 × 144
                </span>

            </div>


            <div class="screen-wrapper">

                <canvas
                    id="screen"
                    width="160"
                    height="144"
                ></canvas>

            </div>


            <!-- =============================================
                 CONTROLS
                 ============================================== -->

            <div class="controls">

                <button
                    id="startButton"
                    class="primary"
                >
                    ▶ Start
                </button>


                <button
                    id="pauseButton"
                >
                    ⏸ Pauza
                </button>


                <button
                    id="resetButton"
                >
                    ↻ Reset
                </button>


                <button
                    id="saveButton"
                >
                    💾 Save
                </button>


                <button
                    id="loadSaveButton"
                >
                    📂 Load Save
                </button>


                <button
                    id="fullscreenButton"
                >
                    ⛶ Pełny ekran
                </button>

            </div>

        </section>


        <!-- =================================================
             SIDEBAR
             ================================================== -->

        <aside class="side">


            <!-- =============================================
                 ROM
                 ============================================== -->

            <section class="panel side-panel">

                <h3>
                    ROM
                </h3>


                <div class="file-area">

                    <label
                        class="file-label"
                        for="romInput"
                    >

                        <span>
                            📦<br>
                            Wybierz ROM Game Boy
                        </span>

                    </label>


                    <input
                        id="romInput"
                        type="file"
                        accept=".gb,.gbc,application/octet-stream"
                    >


                    <div
                        id="fileName"
                        class="file-name"
                    >
                        Nie wybrano ROM-u
                    </div>

                </div>

            </section>


            <!-- =============================================
                 CARTRIDGE INFO
                 ============================================== -->

            <section class="panel side-panel">

                <h3>
                    Cartridge
                </h3>


                <div class="info">

                    <div class="info-row">

                        <span class="info-label">
                            Tytuł
                        </span>

                        <span
                            id="gameTitle"
                            class="info-value"
                        >
                            —
                        </span>

                    </div>


                    <div class="info-row">

                        <span class="info-label">
                            MBC
                        </span>

                        <span
                            id="gameMBC"
                            class="info-value"
                        >
                            —
                        </span>

                    </div>


                    <div class="info-row">

                        <span class="info-label">
                            ROM
                        </span>

                        <span
                            id="gameROM"
                            class="info-value"
                        >
                            —
                        </span>

                    </div>


                    <div class="info-row">

                        <span class="info-label">
                            RAM
                        </span>

                        <span
                            id="gameRAM"
                            class="info-value"
                        >
                            —
                        </span>

                    </div>


                    <div class="info-row">

                        <span class="info-label">
                            Bank ROM
                        </span>

                        <span
                            id="romBank"
                            class="info-value"
                        >
                            —
                        </span>

                    </div>

                </div>

            </section>


            <!-- =============================================
                 EMULATOR INFO
                 ============================================== -->

            <section class="panel side-panel">

                <h3>
                    Emulator
                </h3>


                <div class="info">

                    <div class="info-row">

                        <span class="info-label">
                            CPU
                        </span>

                        <span class="info-value">
                            LR35902
                        </span>

                    </div>


                    <div class="info-row">

                        <span class="info-label">
                            Clock
                        </span>

                        <span class="info-value">
                            4.194 MHz
                        </span>

                    </div>


                    <div class="info-row">

                        <span class="info-label">
                            FPS
                        </span>

                        <span class="info-value">
                            59.73
                        </span>

                    </div>


                    <div class="info-row">

                        <span class="info-label">
                            Frame
                        </span>

                        <span
                            id="frameCount"
                            class="info-value"
                        >
                            0
                        </span>

                    </div>


                    <div class="info-row">

                        <span class="info-label">
                            Cycles
                        </span>

                        <span
                            id="cycleCount"
                            class="info-value"
                        >
                            0
                        </span>

                    </div>

                </div>

            </section>


            <!-- =============================================
                 LOG
                 ============================================== -->

            <section class="panel side-panel">

                <h3>
                    Log
                </h3>


                <div
                    id="log"
                    class="log"
                ></div>

            </section>

        </aside>

    </main>


    <!-- =====================================================
         FOOTER
         ====================================================== -->

    <footer>

        WebBktx · Web Game Boy Emulator · JavaScript / Canvas

    </footer>

</div>


<!-- =========================================================
     JAVASCRIPT
     ========================================================== -->

<script type="module">

    import GameBoyEmulator
        from "./emulator.js";


    /*
     * ========================================================
     * ELEMENTS
     * ========================================================
     */

    const canvas =
        document.getElementById(
            "screen"
        );


    const romInput =
        document.getElementById(
            "romInput"
        );


    const fileName =
        document.getElementById(
            "fileName"
        );


    const status =
        document.getElementById(
            "status"
        );


    const statusText =
        document.getElementById(
            "statusText"
        );


    const startButton =
        document.getElementById(
            "startButton"
        );


    const pauseButton =
        document.getElementById(
            "pauseButton"
        );


    const resetButton =
        document.getElementById(
            "resetButton"
        );


    const saveButton =
        document.getElementById(
            "saveButton"
        );


    const loadSaveButton =
        document.getElementById(
            "loadSaveButton"
        );


    const fullscreenButton =
        document.getElementById(
            "fullscreenButton"
        );


    const logElement =
        document.getElementById(
            "log"
        );


    /*
     * Cartridge info
     */

    const gameTitle =
        document.getElementById(
            "gameTitle"
        );


    const gameMBC =
        document.getElementById(
            "gameMBC"
        );


    const gameROM =
        document.getElementById(
            "gameROM"
        );


    const gameRAM =
        document.getElementById(
            "gameRAM"
        );


    const romBank =
        document.getElementById(
            "romBank"
        );


    /*
     * Emulator info
     */

    const frameCount =
        document.getElementById(
            "frameCount"
        );


    const cycleCount =
        document.getElementById(
            "cycleCount"
        );


    /*
     * ========================================================
     * LOG
     * ========================================================
     */

    function log(
        message
    ) {

        const line =
            document.createElement(
                "div"
            );


        line.className =
            "log-line";


        const time =
            new Date()
                .toLocaleTimeString();


        line.textContent =
            `[${time}] ${message}`;


        logElement.appendChild(
            line
        );


        /*
         * Najnowszy wpis na dole.
         */

        logElement.scrollTop =
            logElement.scrollHeight;

    }


    /*
     * ========================================================
     * STATUS
     * ========================================================
     */

    function setStatus(
        message,
        running = false
    ) {

        statusText.textContent =
            message;


        status.classList.toggle(
            "running",
            running
        );

    }


    /*
     * ========================================================
     * CREATE EMULATOR
     * ========================================================
     */

    const emulator =
        new GameBoyEmulator({

            audio:
                true,

            debug:
                true,


            onStatus:
                message => {

                    log(
                        message
                    );

                },


            onError:
                error => {

                    setStatus(
                        "Błąd"
                    );


                    log(
                        "ERROR: " +
                        error.message
                    );

                },


            onFrame:
                frame => {

                    frameCount.textContent =
                        frame.toLocaleString();

                }

        });


    /*
     * Udostępniamy emulator
     * w konsoli przeglądarki.
     *
     * Przydatne podczas debugowania.
     */

    window.webbktx =
        emulator;


    /*
     * ========================================================
     * CANVAS
     * ========================================================
     */

    emulator.attachCanvas(
        canvas
    );


    log(
        "WebBktx Game Boy gotowy."
    );


    /*
     * ========================================================
     * ROM SELECT
     * ========================================================
     */

    romInput.addEventListener(
        "change",
        async event => {

            const file =
                event.target.files[0];


            if (
                !file
            ) {

                return;

            }


            fileName.textContent =
                file.name;


            setStatus(
                "Ładowanie ROM-u..."
            );


            log(
                `Ładowanie: ${file.name}`
            );


            try {

                const buffer =
                    await file.arrayBuffer();


                const success =
                    emulator.loadROM(
                        buffer
                    );


                if (
                    !success
                ) {

                    setStatus(
                        "Błąd ROM-u"
                    );

                    return;

                }


                /*
                 * Aktualizacja informacji
                 * o cartridge.
                 */

                updateInfo();


                /*
                 * Automatyczne wczytanie
                 * save data.
                 */

                emulator.loadFromStorage();


                setStatus(
                    "ROM gotowy"
                );


                log(
                    "ROM gotowy do uruchomienia."
                );


            } catch (
                error
            ) {

                console.error(
                    error
                );


                setStatus(
                    "Błąd"
                );


                log(
                    "Nie udało się załadować ROM-u."
                );

            }

        }
    );


    /*
     * ========================================================
     * START
     * ========================================================
     */

    startButton.addEventListener(
        "click",
        () => {

            try {

                emulator.start();


                setStatus(
                    "Uruchomiony",
                    true
                );


                log(
                    "Emulator START."
                );


            } catch (
                error
            ) {

                console.error(
                    error
                );


                setStatus(
                    "Załaduj ROM"
                );


                log(
                    error.message
                );

            }

        }
    );


    /*
     * ========================================================
     * PAUSE
     * ========================================================
     */

    pauseButton.addEventListener(
        "click",
        () => {

            emulator.pause();


            setStatus(
                "Pauza"
            );


            log(
                "Emulator PAUSE."
            );

        }
    );


    /*
     * ========================================================
     * RESET
     * ========================================================
     */

    resetButton.addEventListener(
        "click",
        () => {

            if (
                !emulator.romLoaded
            ) {

                return;

            }


            emulator.reset();


            setStatus(
                "Zresetowany"
            );


            updateInfo();


            log(
                "Emulator RESET."
            );

        }
    );


    /*
     * ========================================================
     * SAVE
     * ========================================================
     */

    saveButton.addEventListener(
        "click",
        () => {

            const success =
                emulator.saveToStorage();


            if (
                success
            ) {

                log(
                    "Save zapisany w LocalStorage."
                );

            } else {

                log(
                    "Ten cartridge nie posiada RAM."
                );

            }

        }
    );


    /*
     * ========================================================
     * LOAD SAVE
     * ========================================================
     */

    loadSaveButton.addEventListener(
        "click",
        () => {

            const success =
                emulator.loadFromStorage();


            if (
                success
            ) {

                log(
                    "Save wczytany."
                );

            } else {

                log(
                    "Brak zapisu."
                );

            }

        }
    );


    /*
     * ========================================================
     * FULLSCREEN
     * ========================================================
     */

    fullscreenButton.addEventListener(
        "click",
        async () => {

            try {

                if (
                    document.fullscreenElement
                ) {

                    await document.exitFullscreen();

                } else {

                    await canvas.requestFullscreen();

                }

            } catch (
                error
            ) {

                log(
                    "Fullscreen niedostępny."
                );

            }

        }
    );


    /*
     * ========================================================
     * KEYBOARD
     * ========================================================
     *
     * Możemy dodatkowo obsługiwać:
     *
     * Enter
     * Space
     *
     * jako Start/Pause.
     *
     * Input właściwy jest w input.js.
     * ========================================================
     */

    document.addEventListener(
        "keydown",
        event => {

            if (
                event.code ===
                "F8"
            ) {

                event.preventDefault();


                emulator.togglePause();


                if (
                    emulator.running
                ) {

                    setStatus(
                        "Uruchomiony",
                        true
                    );

                } else {

                    setStatus(
                        "Pauza"
                    );

                }

            }


            if (
                event.code ===
                "F9"
            ) {

                event.preventDefault();


                emulator.reset();


                setStatus(
                    "Zresetowany"
                );

            }

        }
    );


    /*
     * ========================================================
     * UPDATE INFO
     * ========================================================
     */

    function updateInfo() {

        const info =
            emulator.getInfo();


        /*
         * Cartridge
         */

        if (
            info.cartridge
        ) {

            gameTitle.textContent =
                info.cartridge.title ||
                "Unknown";


            gameMBC.textContent =
                info.cartridge.mbc ||
                "ROM";


            gameROM.textContent =
                formatBytes(
                    info.cartridge.romSize
                );


            gameRAM.textContent =
                formatBytes(
                    info.cartridge.ramSize
                );


            romBank.textContent =
                info.cartridge.romBank ??
                "—";

        }


        /*
         * Emulator
         */

        frameCount.textContent =
            (
                info.frame ??
                0
            ).toLocaleString();


        cycleCount.textContent =
            (
                info.cycles ??
                0
            ).toLocaleString();

    }


    /*
     * ========================================================
     * FORMAT BYTES
     * ========================================================
     */

    function formatBytes(
        bytes
    ) {

        if (
            !bytes
        ) {

            return "0 B";

        }


        if (
            bytes < 1024
        ) {

            return (
                bytes +
                " B"
            );

        }


        if (
            bytes < 1024 * 1024
        ) {

            return (
                (
                    bytes /
                    1024
                ).toFixed(1) +
                " KB"
            );

        }


        return (
            (
                bytes /
                (1024 * 1024)
            ).toFixed(1) +
            " MB"
        );

    }


    /*
     * ========================================================
     * INFO REFRESH
     * ========================================================
     */

    setInterval(
        () => {

            if (
                emulator.romLoaded
            ) {

                updateInfo();

            }

        },
        500
    );


    /*
     * ========================================================
     * INITIAL STATUS
     * ========================================================
     */

    setStatus(
        "Gotowy"
    );

</script>

</body>
</html>
