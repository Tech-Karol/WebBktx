<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <!-- WebBktx metadata -->
    <meta name="application-name" content="WebBktx">
    <meta
        name="description"
        content="WebBktx — platforma emulatorów działających bezpośrednio w przeglądarce."
    >
    <meta name="generator" content="WebBktx">
    <meta name="webbktx-schema" content="webbktx.console.v1">

    <title>WebBktx</title>

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            color-scheme: dark;

            --background: #090b0f;
            --surface: #11151b;
            --surface-hover: #181e26;
            --border: #252c36;
            --text: #ffffff;
            --muted: #9ca6b5;
            --accent: #5865f2;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--background);
            color: var(--text);
        }

        /* HEADER */

        header {
            position: sticky;
            top: 0;
            z-index: 10;

            padding: 18px 28px;

            background: rgba(9, 11, 15, 0.9);
            backdrop-filter: blur(14px);

            border-bottom: 1px solid var(--border);
        }

        .header-content {
            max-width: 1200px;
            margin: auto;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 42px;
            height: 42px;

            display: grid;
            place-items: center;

            border-radius: 12px;

            background: var(--accent);

            font-size: 22px;
        }

        .brand-name {
            font-size: 21px;
            font-weight: 800;
        }

        .brand-version {
            margin-left: 6px;

            color: var(--muted);
            font-size: 12px;
            font-weight: 500;
        }

        /* MAIN */

        main {
            max-width: 1200px;
            margin: auto;
            padding: 55px 28px;
        }

        .hero {
            margin-bottom: 45px;
        }

        .hero h1 {
            margin: 0 0 12px;

            font-size: clamp(36px, 6vw, 64px);
            line-height: 1;

            letter-spacing: -2px;
        }

        .hero p {
            max-width: 650px;

            margin: 0;

            color: var(--muted);

            font-size: 17px;
            line-height: 1.6;
        }

        /* SEARCH */

        .toolbar {
            display: flex;
            gap: 12px;

            margin-bottom: 28px;
        }

        #search {
            width: 100%;

            padding: 14px 16px;

            border: 1px solid var(--border);
            border-radius: 12px;

            outline: none;

            background: var(--surface);
            color: var(--text);

            font-size: 15px;
        }

        #search:focus {
            border-color: var(--accent);
        }

        /* GRID */

        #consoleGrid {
            display: grid;

            grid-template-columns:
                repeat(auto-fill, minmax(250px, 1fr));

            gap: 18px;
        }

        /* CONSOLE CARD */

        .console-card {
            overflow: hidden;

            display: flex;
            flex-direction: column;

            min-height: 260px;

            background: var(--surface);

            border: 1px solid var(--border);
            border-radius: 16px;

            transition:
                transform 0.15s ease,
                border-color 0.15s ease,
                background 0.15s ease;
        }

        .console-card:hover {
            transform: translateY(-4px);

            background: var(--surface-hover);

            border-color: #3a4350;
        }

        .console-icon {
            display: grid;
            place-items: center;

            height: 120px;

            background:
                linear-gradient(
                    135deg,
                    #151a22,
                    #0d1015
                );

            font-size: 54px;
        }

        .console-content {
            display: flex;
            flex-direction: column;

            flex: 1;

            padding: 18px;
        }

        .console-name {
            margin: 0 0 6px;

            font-size: 19px;
        }

        .console-manufacturer {
            color: var(--muted);

            font-size: 13px;
        }

        .console-description {
            margin: 14px 0;

            color: var(--muted);

            font-size: 14px;
            line-height: 1.5;
        }

        .console-meta {
            display: flex;
            flex-wrap: wrap;

            gap: 6px;

            margin-top: auto;
            margin-bottom: 14px;
        }

        .tag {
            padding: 5px 8px;

            border-radius: 7px;

            background: #1b212a;

            color: #aeb7c4;

            font-size: 11px;
        }

        /* BUTTON */

        .launch-button {
            width: 100%;

            padding: 11px 14px;

            border: 0;
            border-radius: 10px;

            background: var(--accent);
            color: white;

            font-weight: 700;

            cursor: pointer;

            transition:
                opacity 0.15s ease,
                transform 0.15s ease;
        }

        .launch-button:hover {
            opacity: 0.9;
        }

        .launch-button:active {
            transform: scale(0.98);
        }

        .launch-button.disabled {
            background: #252b34;

            color: #707987;

            cursor: not-allowed;
        }

        /* STATUS */

        #status {
            margin-bottom: 18px;

            color: var(--muted);

            font-size: 14px;
        }

        .error {
            padding: 15px;

            border: 1px solid #542b2b;
            border-radius: 12px;

            background: #1d1111;

            color: #ff8c8c;
        }

        /* FOOTER */

        footer {
            max-width: 1200px;

            margin: 40px auto 0;
            padding: 25px 28px;

            border-top: 1px solid var(--border);

            color: var(--muted);

            font-size: 13px;
        }

        /* MOBILE */

        @media (max-width: 600px) {
            header {
                padding: 14px 18px;
            }

            main {
                padding: 40px 18px;
            }

            .hero h1 {
                letter-spacing: -1px;
            }

            #consoleGrid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="header-content">

        <div class="brand">

            <div class="logo">
                🎮
            </div>

            <div>
                <span class="brand-name">
                    WebBktx
                </span>

                <span class="brand-version">
                    v1
                </span>
            </div>

        </div>

    </div>

</header>


<main>

    <section class="hero">

        <h1>
            WebBktx
        </h1>

        <p>
            Platforma emulatorów działających
            bezpośrednio w przeglądarce.
            Wybierz konsolę i uruchom emulator.
        </p>

    </section>


    <section>

        <div class="toolbar">

            <input
                id="search"
                type="search"
                placeholder="Szukaj konsoli..."
                autocomplete="off"
            >

        </div>


        <div id="status">
            Ładowanie konsol...
        </div>


        <div id="consoleGrid"></div>

    </section>

</main>


<footer>

    WebBktx • Web Emulation Platform

</footer>


<script>

    /*
     * ============================================================
     * WebBktx Console Loader
     * Schema: webbktx.console.v1
     * ============================================================
     */

    const CONSOLE_DATABASE = "./consoles.json";

    const grid =
        document.getElementById("consoleGrid");

    const status =
        document.getElementById("status");

    const search =
        document.getElementById("search");


    let consoles = [];


    /*
     * ------------------------------------------------------------
     * LOAD DATABASE
     * ------------------------------------------------------------
     */

    async function loadConsoleDatabase() {

        try {

            const response =
                await fetch(CONSOLE_DATABASE);

            if (!response.ok) {

                throw new Error(
                    `HTTP ${response.status}`
                );

            }


            const database =
                await response.json();


            /*
             * Validate WebBktx schema
             */

            if (
                database.schema !==
                "webbktx.console.v1"
            ) {

                throw new Error(
                    "Nieobsługiwany schemat consoles.json"
                );

            }


            if (
                !Array.isArray(
                    database.consoles
                )
            ) {

                throw new Error(
                    "Pole 'consoles' musi być tablicą"
                );

            }


            consoles =
                database.consoles;


            renderConsoles(consoles);


        } catch (error) {

            console.error(
                "WebBktx:",
                error
            );


            status.innerHTML = `
                <div class="error">
                    Nie można załadować bazy konsol.
                    <br>
                    <small>
                        ${escapeHTML(error.message)}
                    </small>
                </div>
            `;

        }

    }


    /*
     * ------------------------------------------------------------
     * RENDER CONSOLES
     * ------------------------------------------------------------
     */

    function renderConsoles(list) {

        grid.innerHTML = "";


        if (list.length === 0) {

            status.textContent =
                "Nie znaleziono konsol.";

            return;

        }


        status.textContent =
            `${list.length} konsol`;


        for (
            const consoleInfo of list
        ) {

            grid.appendChild(
                createConsoleCard(
                    consoleInfo
                )
            );

        }

    }


    /*
     * ------------------------------------------------------------
     * CREATE CARD
     * ------------------------------------------------------------
     */

    function createConsoleCard(
        consoleInfo
    ) {

        const card =
            document.createElement("article");

        card.className =
            "console-card";


        /*
         * Icon
         */

        const icon =
            document.createElement("div");

        icon.className =
            "console-icon";

        icon.textContent =
            consoleInfo.ui?.icon ??
            "🎮";


        /*
         * Content
         */

        const content =
            document.createElement("div");

        content.className =
            "console-content";


        /*
         * Name
         */

        const name =
            document.createElement("h2");

        name.className =
            "console-name";

        name.textContent =
            consoleInfo.name ??
            "Unknown Console";


        /*
         * Manufacturer
         */

        const manufacturer =
            document.createElement("div");

        manufacturer.className =
            "console-manufacturer";

        manufacturer.textContent =
            consoleInfo.manufacturer ??
            "Unknown manufacturer";


        /*
         * Description
         */

        const description =
            document.createElement("p");

        description.className =
            "console-description";

        description.textContent =
            consoleInfo.ui?.description ??
            "Brak opisu.";


        /*
         * Metadata tags
         */

        const meta =
            document.createElement("div");

        meta.className =
            "console-meta";


        addTag(
            meta,
            consoleInfo.category
        );

        addTag(
            meta,
            consoleInfo.releaseYear
        );

        addTag(
            meta,
            consoleInfo.status
        );


        /*
         * Launch button
         */

        const button =
            document.createElement("button");

        button.className =
            "launch-button";


        const ready =
            consoleInfo.status ===
            "ready";


        button.textContent =
            ready
                ? "Uruchom emulator"
                : "W przygotowaniu";


        if (!ready) {

            button.classList.add(
                "disabled"
            );

            button.disabled = true;

        } else {

            button.addEventListener(
                "click",
                () => launchConsole(
                    consoleInfo
                )
            );

        }


        content.appendChild(name);
        content.appendChild(manufacturer);
        content.appendChild(description);
        content.appendChild(meta);
        content.appendChild(button);

        card.appendChild(icon);
        card.appendChild(content);


        return card;

    }


    /*
     * ------------------------------------------------------------
     * TAG
     * ------------------------------------------------------------
     */

    function addTag(
        parent,
        value
    ) {

        if (
            value === undefined ||
            value === null
        ) {
            return;
        }


        const tag =
            document.createElement("span");

        tag.className =
            "tag";

        tag.textContent =
            value;

        parent.appendChild(tag);

    }


    /*
     * ------------------------------------------------------------
     * LAUNCH EMULATOR
     * ------------------------------------------------------------
     */

    function launchConsole(
        consoleInfo
    ) {

        const entry =
            consoleInfo.emulator?.entry;


        if (!entry) {

            console.error(
                "Brak emulator.entry:",
                consoleInfo
            );

            return;

        }


        window.location.href =
            entry;

    }


    /*
     * ------------------------------------------------------------
     * SEARCH
     * ------------------------------------------------------------
     */

    search.addEventListener(
        "input",
        () => {

            const query =
                search.value
                    .trim()
                    .toLowerCase();


            if (!query) {

                renderConsoles(
                    consoles
                );

                return;

            }


            const filtered =
                consoles.filter(
                    consoleInfo => {

                        const text = [

                            consoleInfo.id,

                            consoleInfo.name,

                            consoleInfo.manufacturer,

                            consoleInfo.category,

                            consoleInfo.ui?.description,

                            consoleInfo.hardware?.cpu

                        ]
                        .filter(Boolean)
                        .join(" ")
                        .toLowerCase();


                        return text.includes(
                            query
                        );

                    }
                );


            renderConsoles(
                filtered
            );

        }
    );


    /*
     * ------------------------------------------------------------
     * BASIC HTML ESCAPE
     * ------------------------------------------------------------
     */

    function escapeHTML(
        value
    ) {

        return String(value)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");

    }


    /*
     * ------------------------------------------------------------
     * START
     * ------------------------------------------------------------
     */

    loadConsoleDatabase();

</script>

</body>
</html>
